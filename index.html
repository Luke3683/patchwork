<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patchwork</title>
<meta name="description" content="An open source VR multiverse. One hub, many worlds, each one a single file anyone can add.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bowlby+One&display=swap">
<style>
  /* Title card over the live hub: a sewn-on label in the corner of a moving scene. */
  :root {
    --ink: #18132e;
    --cloth: #f4efe2;
    --thread: #ffd166;
    --ember: #ff8a4c;
    --muted: #b9b2cf;
    --display: "Bowlby One", Impact, "Arial Black", sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--cloth); font-family: var(--body); overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #title {
    position: fixed; left: 0; bottom: 0;
    box-sizing: border-box; width: min(100%, 560px); max-height: 100%; overflow-y: auto;
    padding-block: 24px max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
  }
  .label {
    display: flex; flex-direction: column; gap: 16px;
    background: var(--ink); padding: 24px; border-radius: 14px;
    outline: 3px dashed var(--thread); outline-offset: -11px;
  }
  h1 {
    margin: 0; font: 400 clamp(2.5rem, 11vw, 4.1rem)/0.95 var(--display); letter-spacing: 0.005em;
    color: var(--thread); padding: 6px 8px 0;
  }
  .pitch { margin: 0; padding: 0 8px; font-size: 1.05rem; line-height: 1.45; text-wrap: pretty; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 8px; }
  button {
    font: 400 1rem var(--display); color: var(--ink); background: var(--thread);
    border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer;
  }
  button.secondary { background: var(--cloth); }
  button:hover { filter: brightness(1.1); }
  button:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
  #quilt-row { display: flex; gap: 6px; padding: 0 8px; }
  .swatch { width: 44px; height: 44px; border-radius: 4px; outline: 2px dashed var(--cloth); outline-offset: -2px; }
  .swatch.unearned { opacity: 0.28; }
  .small { margin: 0; padding: 0 8px; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
  .small-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  #reset { font: 400 0.9rem var(--body); background: none; color: var(--muted); padding: 0; text-decoration: underline; border-radius: 2px; }

  #legend, #crosshair { display: none; }
  body.playing #title { display: none; }
  body.playing #legend {
    display: block; position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; text-align: center;
    padding: 7px 14px; border-radius: 8px; background: rgb(24 19 46 / 0.78); font-size: 0.85rem; pointer-events: none;
  }
  body.locked #crosshair {
    display: block; position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; border: 2px solid var(--cloth); box-shadow: 0 0 0 1px var(--ink); pointer-events: none;
  }
  body.locked.aiming #crosshair { background: var(--thread); transform: scale(1.5); }
  @media (prefers-reduced-motion: reduce) { body.locked.aiming #crosshair { transform: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<section id="title">
  <div class="label">
    <h1>Patchwork</h1>
    <p class="pitch">A VR multiverse stitched together from many small worlds. Race, shoot, build, solve and keep the beat, then add a world of your own.</p>
    <div class="row">
      <button id="enter-vr" hidden>Enter VR</button>
      <button id="play-desktop" class="secondary">Play on desktop</button>
    </div>
    <div id="quilt-row" aria-hidden="true"></div>
    <div class="small small-row">
      <span id="quilt-count"></span>
      <button id="reset" hidden>Reset progress</button>
    </div>
    <p class="small" id="vr-note">Loading the Crossroads…</p>
  </div>
</section>

<div id="legend">WASD move · Mouse look · Click use · H back to the hub · Esc free the mouse</div>
<div id="crosshair"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
